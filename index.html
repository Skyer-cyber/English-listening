<!DOCTYPE html> 
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>30天听力逆袭打卡计划</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 React 和 Babel -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- 引入 Lucide 图标库 (SVG) -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap');
        body { font-family: 'Noto Sans SC', sans-serif; }
        .animate-fadeIn { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        
        // 图标组件 (手动定义SVG以确保在单文件中无需额外依赖)
        const Icons = {
            Trophy: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="text-yellow-500"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>,
            CheckCircle: ({size=24}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>,
            Circle: ({size=24}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/></svg>,
            BookOpen: ({className}) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>,
            FastForward: ({className}) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polygon points="13 19 22 12 13 5 13 19"/><polygon points="2 19 11 12 2 5 2 19"/></svg>,
            Cloud: ({size=16}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17.5 19c0-3.037-2.463-5.5-5.5-5.5S6.5 15.963 6.5 19"/><path d="M20.6 16c2.667-1 4.333-3.5 3.4-6.4-.667-2.333-2.667-3.6-5-3.6-1.5-3.5-5.5-4.5-8.5-2.5-2.667 2-3 5.5-1.5 8.5"/><path d="M6 13c-3 .5-5 3-5 6"/></svg>
        };
    
        const ListeningTracker = () => {
            // 使用本地存储 (Local Storage)
            const [completedDays, setCompletedDays] = useState(() => {
                const saved = localStorage.getItem('listeningPlanProgress_v2');
                return saved ? JSON.parse(saved) : [];
            });
            const [selectedDay, setSelectedDay] = useState(null);
            const [showIntro, setShowIntro] = useState(() => {
                const saved = localStorage.getItem('listeningPlanProgress_v2');
                return !saved || JSON.parse(saved).length === 0;
            });
    
            useEffect(() => {
                localStorage.setItem('listeningPlanProgress_v2', JSON.stringify(completedDays));
            }, [completedDays]);
    
            const totalDays = 30;
            const progress = Math.round((completedDays.length / totalDays) * 100);
    
            const toggleDayCompletion = (day) => {
                if (completedDays.includes(day)) {
                    setCompletedDays(completedDays.filter(d => d !== day));
                } else {
                    setCompletedDays([...completedDays, day]);
                }
            };
    
            const getDayInfo = (day) => {
                const paperNum = Math.ceil(day / 2);
                const isOdd = day % 2 !== 0;
                
                if (isOdd) {
                    return {
                        title: `Day ${day}: 试卷 ${paperNum} - 诊疗模式`,
                        type: 'precision',
                        theme: 'blue',
                        icon: <Icons.BookOpen className="w-5 h-5" />,
                        desc: "把听不出来的段落“揪出来打”",
                        tasks: [
                            { title: "原速模考", detail: "正常做题，对答案，计算分数。" },
                            { title: "标记错题段", detail: "只要有一道题做错，必须标记这一整段音频。" },
                            { title: "原速盲听复盘", detail: "不看原文，反复听错题段，问自己漏了什么（时间/地点/语气）。" },
                            { title: "2 Plus 循环精听", detail: "对照原文听 -> 再次盲听，循环3-5次直到完全听懂。" }
                        ]
                    };
                } else {
                    return {
                        title: `Day ${day}: 试卷 ${paperNum} - 冲击模式`,
                        type: 'speed',
                        theme: 'red',
                        icon: <Icons.FastForward className="w-5 h-5" />,
                        desc: "用倍速拔高你的语速阈值",
                        tasks: [
                            { title: "1.5倍速热身", detail: "听全文，能抓取40-60%内容即可，为大脑提速。" },
                            { title: "2.0倍速极限冲击", detail: "最痛苦的环节。强迫大脑适应高语速，坚持听完。" },
                            { title: "1.0倍速回落体验", detail: "见证奇迹。感受“慢动作效果”，捕捉句子间的空隙。" },
                            { title: "总结归纳", detail: "记录今天的生词或连读现象。" }
                        ]
                    };
                }
            };
    
            return (
                <div className="min-h-screen bg-slate-50 font-sans text-slate-800 pb-12">
                    {/* Header */}
                    <div className="bg-white shadow-sm sticky top-0 z-10">
                        <div className="max-w-3xl mx-auto px-4 py-4">
                            <div className="flex justify-between items-center mb-2">
                                <h1 className="text-xl font-bold flex items-center gap-2 text-slate-900">
                                    <Icons.Trophy />
                                    30天听力逆袭计划
                                </h1>
                                <div className="flex items-center gap-3">
                                    <span className="text-xs font-medium text-slate-400 flex items-center gap-1">
                                        本机存储
                                    </span>
                                    <span className="text-sm font-medium text-slate-500">已完成 {completedDays.length}/{totalDays} 天</span>
                                </div>
                            </div>
                            <div className="w-full bg-slate-200 h-2.5 rounded-full overflow-hidden">
                                <div 
                                    className="bg-indigo-600 h-2.5 rounded-full transition-all duration-500 ease-out" 
                                    style={{ width: `${progress}%` }}
                                ></div>
                            </div>
                        </div>
                    </div>
    
                    <div className="max-w-3xl mx-auto px-4 py-6">
                        {/* Intro Card */}
                        {showIntro && (
                            <div className="bg-gradient-to-r from-indigo-500 to-purple-600 rounded-xl p-6 text-white mb-8 shadow-lg relative overflow-hidden">
                                <div className="relative z-10">
                                    <h2 className="text-2xl font-bold mb-2">欢迎开始！</h2>
                                    <p className="mb-4 opacity-90">
                                        这是一套非常硬核的训练方案。核心原理是通过<b>“倍速超量恢复”</b>拉高大脑反应阈值。
                                        坚持30天，你回头听原速会觉得像慢动作。
                                    </p>
                                    <button 
                                        onClick={() => setShowIntro(false)}
                                        className="bg-white text-indigo-600 px-4 py-2 rounded-lg font-bold text-sm hover:bg-indigo-50 transition-colors"
                                    >
                                        我准备好了
                                    </button>
                                </div>
                                <div className="absolute right-0 bottom-0 opacity-10 transform translate-x-1/4 translate-y-1/4">
                                    <Icons.Trophy />
                                </div>
                            </div>
                        )}
    
                        {/* Main Grid */}
                        <div className="grid grid-cols-3 sm:grid-cols-5 gap-3 mb-8">
                            {Array.from({ length: totalDays }, (_, i) => i + 1).map((day) => {
                                const isCompleted = completedDays.includes(day);
                                const isCurrent = !isCompleted && (day === 1 || completedDays.includes(day - 1));
                                const info = getDayInfo(day);
                                
                                return (
                                    <button
                                        key={day}
                                        onClick={() => setSelectedDay(day)}
                                        className={`
                                            relative aspect-square rounded-xl flex flex-col items-center justify-center border-2 transition-all duration-200
                                            ${isCompleted 
                                                ? 'bg-green-100 border-green-200 text-green-700' 
                                                : isCurrent 
                                                    ? 'bg-white border-indigo-500 shadow-md scale-105 z-10' 
                                                    : 'bg-white border-slate-200 text-slate-400 hover:border-indigo-200'
                                            }
                                        `}
                                    >
                                        <span className={`text-xl font-bold ${isCurrent ? 'text-indigo-600' : ''}`}>{day}</span>
                                        <div className="mt-1">
                                            {isCompleted ? <Icons.CheckCircle size={16} /> : info.type === 'precision' ? <Icons.BookOpen className="w-3.5 h-3.5" /> : <Icons.FastForward className="w-3.5 h-3.5" />}
                                        </div>
                                    </button>
                                );
                            })}
                        </div>
    
                        {/* Detail View */}
                        {selectedDay ? (
                           <DayDetail 
                             day={selectedDay} 
                             info={getDayInfo(selectedDay)} 
                             isCompleted={completedDays.includes(selectedDay)}
                             onToggle={() => toggleDayCompletion(selectedDay)}
                             onClose={() => setSelectedDay(null)}
                           />
                        ) : (
                          <div className="text-center py-12 text-slate-400 bg-white rounded-xl border border-slate-100 border-dashed">
                            <p>点击上方的天数查看具体任务</p>
                          </div>
                        )}
                    </div>
                </div>
            );
        };
    
        const DayDetail = ({ day, info, isCompleted, onToggle, onClose }) => {
            return (
                <div className="bg-white rounded-2xl shadow-xl border border-slate-100 overflow-hidden animate-fadeIn">
                    <div className={`px-6 py-4 flex justify-between items-center ${info.theme === 'blue' ? 'bg-blue-50' : 'bg-red-50'}`}>
                        <div className="flex items-center gap-3">
                            <div className={`p-2 rounded-lg ${info.theme === 'blue' ? 'bg-blue-100 text-blue-600' : 'bg-red-100 text-red-600'}`}>
                                {info.icon}
                            </div>
                            <div>
                                <h3 className={`font-bold text-lg ${info.theme === 'blue' ? 'text-blue-800' : 'text-red-800'}`}>{info.title}</h3>
                                <p className={`text-xs font-medium ${info.theme === 'blue' ? 'text-blue-600' : 'text-red-600'}`}>{info.desc}</p>
                            </div>
                        </div>
                        <button onClick={onClose} className="text-slate-400 hover:text-slate-600 font-bold text-xl">×</button>
                    </div>
                    
                    <div className="p-6">
                        <div className="space-y-4">
                            {info.tasks.map((task, idx) => (
                                <div key={idx} className="flex gap-4 items-start group">
                                    <div className={`mt-1 flex-shrink-0 w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold 
                                        ${info.theme === 'blue' ? 'bg-blue-100 text-blue-600' : 'bg-red-100 text-red-600'}`}>
                                        {idx + 1}
                                    </div>
                                    <div>
                                        <h4 className="font-bold text-slate-800">{task.title}</h4>
                                        <p className="text-sm text-slate-500 leading-relaxed">{task.detail}</p>
                                    </div>
                                </div>
                            ))}
                        </div>
    
                        <hr className="my-6 border-slate-100" />
    
                        <button 
                            onClick={onToggle}
                            className={`w-full py-3.5 rounded-xl font-bold flex items-center justify-center gap-2 transition-all
                                ${isCompleted 
                                    ? 'bg-green-50 text-green-600 border border-green-200 hover:bg-green-100' 
                                    : 'bg-slate-900 text-white hover:bg-slate-800 shadow-lg hover:shadow-xl transform hover:-translate-y-0.5'
                                }
                            `}
                        >
                            {isCompleted ? (
                                <React.Fragment><Icons.CheckCircle size={20} /> 已完成打卡</React.Fragment>
                            ) : (
                                <React.Fragment><Icons.Circle size={20} /> 完成今日训练</React.Fragment>
                            )}
                        </button>
                    </div>
                </div>
            );
        };
    
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ListeningTracker />);
    </script>
</body>
</html>
